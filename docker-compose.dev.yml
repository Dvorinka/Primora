# Development overlay — services that must never ship to production.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  mailpit:
    image: axllent/mailpit:v1.27.9
    ports:
      - "${MAILPIT_HTTP_PORT}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      mailpit:
        condition: service_started

  nginx:
    volumes:
      - ./infra/nginx/mailpit.conf:/etc/nginx/primora-extra/mailpit.conf:ro
    depends_on:
      mailpit:
        condition: service_started
