        "401":
          $ref: "#/components/responses/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    OrganizationID:
      name: organizationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectID:
      name: projectID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BucketID:
      name: bucketID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApiKeyID:
      name: apiKeyID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CollectionID:
      name: collectionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentID:
      name: documentID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationID:
      name: invitationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ComponentID:
      name: componentID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaginationLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    PaginationOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 100000
        default: 0
    AuditQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
    AuditAction:
      name: action
      in: query
      required: false
      schema:
        type: string
    ObjectKey:
      name: objectKey
      in: path
      required: true
      schema:
        type: string
    ConnectionID:
      name: connectionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IntegrationID:
      name: integrationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookID:
      name: webhookID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobID:
      name: jobID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DatabaseQuery:
      name: database
      in: query
      required: false
      schema:
        type: string
    SchemaQuery:
      name: schema
      in: query
      required: false
      schema:
        type: string
    TableQuery:
      name: table
      in: query
      required: true
      schema:
        type: string
  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
