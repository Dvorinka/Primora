openapi: 3.1.0
info:
  title: Primora API
  version: 0.2.14
  description: Core Primora platform API for tenancy, storage, API keys, and audit operations.
servers:
  - url: /api/v1
tags:
  - name: Health
  - name: Platform
  - name: Organizations
  - name: Projects
  - name: Storage
  - name: Collections
  - name: Databases
  - name: Telemetry
  - name: Integrations
  - name: Webhooks
  - name: Automation
paths:
  /health/liveness:
    get:
      tags: [Health]
      operationId: getLiveness
      responses:
        "200":
          description: Liveness check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/readiness:
    get:
      tags: [Health]
      operationId: getReadiness
      responses:
        "200":
          description: Readiness check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /metrics:
    get:
      tags: [Health]
      operationId: getMetrics
      summary: Prometheus text exposition of platform HTTP metrics
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
  /me:
    get:
      tags: [Platform]
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current authenticated user and tenancy summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /bootstrap:
    post:
      tags: [Platform]
      operationId: bootstrapPlatform
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "201":
          description: Platform bootstrapped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organizations for the current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationMembership"
                required: [items]
    post:
      tags: [Organizations]
      operationId: createOrganization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMembership"
  /organizations/{organizationID}:
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "204":
          description: Organization updated
    delete:
      tags: [Organizations]
      operationId: deleteOrganization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
      responses:
        "204":
          description: Organization deleted
  /organizations/{organizationID}/members:
    get:
      tags: [Organizations]
      operationId: listOrganizationMembers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
      responses:
        "200":
          description: Members of an organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationMember"
                required: [items]
  /organizations/{organizationID}/members/{userID}:
    patch:
      tags: [Organizations]
      operationId: updateOrganizationMemberRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationMemberRoleRequest"
      responses:
        "200":
          description: Organization member role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"
    delete:
      tags: [Organizations]
      operationId: removeOrganizationMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Organization member removed
  /organizations/{organizationID}/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - $ref: "#/components/parameters/AuditQuery"
      responses:
        "200":
          description: Projects within an organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
                required: [items]
    post:
      tags: [Projects]
      operationId: createProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /organizations/{organizationID}/invitations:
    get:
      tags: [Organizations]
      operationId: listOrganizationInvitations
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
      responses:
        "200":
          description: Invitations for an organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationInvitation"
                required: [items]
    post:
      tags: [Organizations]
      operationId: createInvitation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
  /organizations/{organizationID}/invitations/{invitationID}:
    delete:
      tags: [Organizations]
      operationId: revokeInvitation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - $ref: "#/components/parameters/InvitationID"
      responses:
        "204":
          description: Invitation revoked
  /invitations/accept:
    post:
      tags: [Organizations]
      operationId: acceptInvitation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "204":
          description: Invitation accepted
  /projects/{projectID}/overview:
    get:
      tags: [Projects]
      operationId: getProjectOverview
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Aggregated project overview metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOverview"
  /projects/{projectID}/api-keys:
    get:
      tags: [Projects]
      operationId: listApiKeys
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: API keys for a project
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
                required: [items]
    post:
      tags: [Projects]
      operationId: createApiKey
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
  /projects/{projectID}:
    patch:
      tags: [Projects]
      operationId: updateProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "204":
          description: Project updated
    delete:
      tags: [Projects]
      operationId: deleteProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "204":
          description: Project deleted
  /projects/{projectID}/members:
    get:
      tags: [Projects]
      operationId: listProjectMembers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Members of a project
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectMember"
                required: [items]
  /projects/{projectID}/members/{userID}:
    patch:
      tags: [Projects]
      operationId: updateProjectMemberRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectMemberRoleRequest"
      responses:
        "200":
          description: Project member role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
    delete:
      tags: [Projects]
      operationId: removeProjectMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Project member removed
  /projects/{projectID}/api-keys/{apiKeyID}:
    delete:
      tags: [Projects]
      operationId: revokeApiKey
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/ApiKeyID"
      responses:
        "204":
          description: API key revoked
  /projects/{projectID}/buckets:
    get:
      tags: [Storage]
      operationId: listBuckets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/AuditQuery"
      responses:
        "200":
          description: Buckets for a project
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bucket"
                required: [items]
    post:
      tags: [Storage]
      operationId: createBucket
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBucketRequest"
      responses:
        "201":
          description: Bucket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
  /projects/{projectID}/audit-logs:
    get:
      tags: [Projects]
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/AuditQuery"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/PaginationLimit"
        - $ref: "#/components/parameters/PaginationOffset"
      responses:
        "200":
          description: Audit logs for a project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
  /buckets/{bucketID}/objects:
    get:
      tags: [Storage]
      operationId: listBucketObjects
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/BucketID"
        - $ref: "#/components/parameters/AuditQuery"
        - $ref: "#/components/parameters/PaginationLimit"
        - $ref: "#/components/parameters/PaginationOffset"
      responses:
        "200":
          description: Bucket objects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BucketObjectListResponse"
    post:
      tags: [Storage]
      operationId: uploadBucketObject
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/BucketID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                objectKey:
                  type: string
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: Bucket object created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BucketObject"
  /buckets/{bucketID}/object-copies:
    post:
      tags: [Storage]
      operationId: copyBucketObject
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/BucketID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyBucketObjectRequest"
      responses:
        "201":
          description: Bucket object copied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BucketObject"
  /buckets/{bucketID}:
    patch:
      tags: [Storage]
      operationId: updateBucket
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BucketID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBucketRequest"
      responses:
        "204":
          description: Bucket updated
    delete:
      tags: [Storage]
      operationId: deleteBucket
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BucketID"
      responses:
        "204":
          description: Bucket deleted
  /buckets/{bucketID}/objects/{objectKey}:
    get:
      tags: [Storage]
      operationId: downloadBucketObject
      security:
        - bearerAuth: []
        - apiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/BucketID"
        - $ref: "#/components/parameters/ObjectKey"
      responses:
        "200":
          description: Bucket object bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
    patch:
      tags: [Storage]
      operationId: updateBucketObject
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/BucketID"
        - $ref: "#/components/parameters/ObjectKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBucketObjectRequest"
      responses:
        "204":
          description: Bucket object updated
    delete:
      tags: [Storage]
      operationId: deleteBucketObject
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/BucketID"
        - $ref: "#/components/parameters/ObjectKey"
      responses:
        "204":
          description: Bucket object deleted
  /projects/{projectID}/collections:
    get:
      tags: [Collections]
      operationId: listCollections
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: List of collections in the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionListResponse"
    post:
      tags: [Collections]
      operationId: createCollection
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionRequest"
      responses:
        "201":
          description: Collection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
  /projects/{projectID}/collections/{collectionID}:
    get:
      tags: [Collections]
      operationId: getCollection
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/CollectionID"
      responses:
        "200":
          description: Collection details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
    patch:
      tags: [Collections]
      operationId: updateCollection
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/CollectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCollectionRequest"
      responses:
        "200":
          description: Collection updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
    delete:
      tags: [Collections]
      operationId: deleteCollection
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/CollectionID"
      responses:
        "204":
          description: Collection deleted
  /collections/{collectionID}/documents:
    get:
      tags: [Collections]
      operationId: listDocuments
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionID"
        - $ref: "#/components/parameters/PaginationLimit"
        - $ref: "#/components/parameters/PaginationOffset"
      responses:
        "200":
          description: List of documents in the collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
    post:
      tags: [Collections]
      operationId: createDocument
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentRequest"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
  /collections/{collectionID}/documents/{documentID}:
    get:
      tags: [Collections]
      operationId: getDocument
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionID"
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: Document details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    patch:
      tags: [Collections]
      operationId: updateDocument
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionID"
        - $ref: "#/components/parameters/DocumentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentRequest"
      responses:
        "200":
          description: Document updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    delete:
      tags: [Collections]
      operationId: deleteDocument
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/CollectionID"
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "204":
          description: Document deleted
  /db/status:
    get:
      tags: [Databases]
      operationId: getDbxStatus
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: DBX subprocess availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DBXStatus"
  /projects/{projectID}/db-connections:
    get:
      tags: [Databases]
      operationId: listDbConnections
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Saved database connections for the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DBConnectionListResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Databases]
      operationId: createDbConnection
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDBConnectionRequest"
      responses:
        "201":
          description: Connection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DBConnection"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /projects/{projectID}/db-connections/{connectionID}:
    delete:
      tags: [Databases]
      operationId: deleteDbConnection
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "204":
          description: Connection deleted
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /projects/{projectID}/db-connections/{connectionID}/test:
    post:
      tags: [Databases]
      operationId: testDbConnection
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: Connectivity probe result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DBConnectionTestResult"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /projects/{projectID}/db-connections/{connectionID}/databases:
    get:
      tags: [Databases]
      operationId: listDbDatabases
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: Databases reachable through the connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DBDatabaseListResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
  /projects/{projectID}/db-connections/{connectionID}/tables:
    get:
      tags: [Databases]
      operationId: listDbTables
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/ConnectionID"
        - $ref: "#/components/parameters/DatabaseQuery"
        - $ref: "#/components/parameters/SchemaQuery"
      responses:
        "200":
          description: Tables, views, or collections in the connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DBTableListResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
  /projects/{projectID}/db-connections/{connectionID}/describe:
    get:
      tags: [Databases]
      operationId: describeDbTable
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
